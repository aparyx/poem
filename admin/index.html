<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f6f1"><title>Private Library — Ad</title><link rel="stylesheet" href="../css/styles.css?v=20261031b"><link rel="stylesheet" href="../css/admin.css?v=20261031b"><script src="../js/admin.js" defer></script></head><body><header class="header"><a class="brand" href="../index.html">ad<span>.</span></a><span class="admin-label">PRIVATE LIBRARY / AUTHOR ACCESS</span><a class="back-link" href="../index.html">EXIT ↗</a></header><main class="admin-wrap"><section id="login-panel" class="login-panel"><p class="micro">THE AUTHOR'S ROOM</p><h1>Enter the<br><i>quiet.</i></h1><p class="admin-copy">This room is private. Sign in to manage your writing.</p><form id="login-form"><label for="password">PASSPHRASE</label><input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Enter your passphrase"><button class="admin-button" type="submit">UNLOCK THE LIBRARY ↗</button><p id="login-error" class="notice" role="alert"></p></form></section><section id="workspace" hidden><div class="workspace-head"><div><p class="micro">THE AUTHOR'S ROOM</p><h1>Your <i>library.</i></h1></div><button id="logout" class="quiet-button">LOCK & EXIT ↗</button></div><div class="workspace-grid"><aside class="draft-list"><button id="new-entry" class="admin-button">+ NEW PIECE</button><h2>YOUR WRITING</h2><div id="entries-list"></div></aside><form id="editor" class="editor"><input type="hidden" id="entry-id"><label for="title">TITLE</label><input id="title" maxlength="180" required><label for="subtitle">SUBTITLE (OPTIONAL)</label><input id="subtitle" maxlength="240"><div class="two-fields"><div><label for="category">ROOM</label><select id="category"><option value="poetry">Poetry</option><option value="fiction">Fiction</option><option value="essays">Essays & ideas</option><option value="fragments">Fragments</option></select></div><div><label for="date">DATE</label><input id="date" type="date"></div></div><label for="excerpt">SHORT DESCRIPTION</label><input id="excerpt" maxlength="500"><label for="tags">TAGS</label><input id="tags" placeholder="memory, winter, solitude"><label for="body">THE WRITING</label><textarea id="body" maxlength="50000" rows="18" required></textarea><div class="editor-actions"><label class="publish-check"><input id="published" type="checkbox"> PUBLISH TO PUBLIC ARCHIVE</label><button class="admin-button" type="submit">SAVE PIECE ↗</button><button id="delete-entry" class="quiet-button danger" type="button" hidden>DELETE</button></div><p id="save-notice" class="notice" role="status"></p></form></div></section></main><footer class="footer wrap"><a class="brand" href="../index.html">ad<span>.</span></a><span>PRIVATE BY DESIGN</span><span>© AD</span></footer></body></html>
